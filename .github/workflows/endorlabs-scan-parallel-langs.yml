              - .eslint-plugin-local/**/'**/pnpm-lock.yaml'
              - .eslint-plugin-local/**/'**/rush.json'
              - .eslint-plugin-local/**/'**/*.js'
              - .eslint-plugin-local/**/'**/*.ts'
              - .eslint-plugin-local/**/'**/*.tsx'
            javascript-typescript-scripts:
