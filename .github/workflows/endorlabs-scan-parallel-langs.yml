#     Each shard scans one top-level subtree with full reachability preserved.
#
name: Endor Labs Scan
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      java: ${{ steps.filter.outputs.java }}
      javascript-typescript-extensions: ${{ steps.filter.outputs.javascript-typescript-extensions }}
      javascript-typescript-build: ${{ steps.filter.outputs.javascript-typescript-build }}
      javascript-typescript-vscode: ${{ steps.filter.outputs.javascript-typescript-vscode }}
      javascript-typescript-remote: ${{ steps.filter.outputs.javascript-typescript-remote }}
      javascript-typescript-eslint-plugin-local: ${{ steps.filter.outputs.javascript-typescript-eslint-plugin-local }}
      javascript-typescript-scripts: ${{ steps.filter.outputs.javascript-typescript-scripts }}
      javascript-typescript-root: ${{ steps.filter.outputs.javascript-typescript-root }}
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |-
            java:
              - '**/pom.xml'
              - '**/build.gradle'
              - '**/build.gradle.kts'
              - '**/*.java'
            javascript-typescript-extensions:
              - extensions/**/'**/package.json'
              - extensions/**/'**/package-lock.json'
              - extensions/**/'**/yarn.lock'
              - extensions/**/'**/pnpm-lock.yaml'
              - extensions/**/'**/rush.json'
              - extensions/**/'**/*.js'
              - extensions/**/'**/*.ts'
              - extensions/**/'**/*.tsx'
            javascript-typescript-build:
              - build/**/'**/package.json'
              - build/**/'**/package-lock.json'
              - build/**/'**/yarn.lock'
              - build/**/'**/pnpm-lock.yaml'
              - build/**/'**/rush.json'
              - build/**/'**/*.js'
              - build/**/'**/*.ts'
              - build/**/'**/*.tsx'
            javascript-typescript-vscode:
              - .vscode/**/'**/package.json'
              - .vscode/**/'**/package-lock.json'
              - .vscode/**/'**/yarn.lock'
              - .vscode/**/'**/pnpm-lock.yaml'
              - .vscode/**/'**/rush.json'
              - .vscode/**/'**/*.js'
              - .vscode/**/'**/*.ts'
              - .vscode/**/'**/*.tsx'
            javascript-typescript-remote:
              - remote/**/'**/package.json'
              - remote/**/'**/package-lock.json'
              - remote/**/'**/yarn.lock'
              - remote/**/'**/pnpm-lock.yaml'
              - remote/**/'**/rush.json'
              - remote/**/'**/*.js'
              - remote/**/'**/*.ts'
              - remote/**/'**/*.tsx'
