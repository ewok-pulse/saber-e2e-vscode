              - scripts/**/'**/package-lock.json'
              - scripts/**/'**/yarn.lock'
              - scripts/**/'**/pnpm-lock.yaml'
              - scripts/**/'**/rush.json'
              - scripts/**/'**/*.js'
              - scripts/**/'**/*.ts'
              - scripts/**/'**/*.tsx'
            javascript-typescript-root:
              - '**/package.json'
              - '**/package-lock.json'
              - '**/yarn.lock'
              - '**/pnpm-lock.yaml'
              - '**/rush.json'
              - '**/*.js'
              - '**/*.ts'
              - '**/*.tsx'
            python:
              - '**/requirements.txt'
              - '**/pyproject.toml'
              - '**/poetry.lock'
              - '**/setup.py'
              - '**/setup.cfg'
              - '**/Pipfile'
              - '**/Pipfile.lock'
              - '**/pdm.lock'
              - '**/uv.lock'
              - '**/*.py'
            rust:
              - '**/Cargo.toml'
              - '**/Cargo.lock'
